services:
  shirt-reel-maker:
    image: nginx:alpine
    container_name: shirt-reel-maker
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entry.sh"]
    environment:
      # IPs the https certificate should be valid for (space separated)
      CERT_IPS: "192.168.0.50 192.168.10.154"
    ports:
      - "8089:80"     # normal link  (http://NAS-IP:8089)
      - "8443:443"    # secure link  (https://NAS-IP:8443)  -> fast video mode
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./entry.sh:/entry.sh:ro
      - ./certs:/certs
      # finished videos, music library and shared presets are stored in the office share:
      - /srv/dev-disk-by-uuid-07745e93-67d6-4171-93e2-f78f05f3f77e/Office/ShirtReels:/data

  # talks to Google for the "AI video" tab. The API key stays here (file .env), never in the web page.
  ai-proxy:
    image: python:3.12-alpine
    container_name: shirt-reel-ai
    restart: unless-stopped
    command: ["python", "-u", "/app/server.py"]
    environment:
      # read from the file .env next to this docker-compose.yml (see .env.example)
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}
      AI_DAILY_IMAGE_LIMIT: ${AI_DAILY_IMAGE_LIMIT:-100}
    volumes:
      - ./ai-proxy:/app:ro
