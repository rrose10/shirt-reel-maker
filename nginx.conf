user root;
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events { worker_connections 256; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    sendfile on;
    client_max_body_size 800m;
    client_body_temp_path /data/.tmp 1 2;

    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        ssl_certificate     /certs/cert.pem;
        ssl_certificate_key /certs/key.pem;

        root /usr/share/nginx/html;
        index index.html;

        # always fetch the newest version after you update site/index.html
        add_header Cache-Control "no-cache, must-revalidate";

        location / {
            try_files $uri $uri/ =404;
        }

        # --- AI video tab: forwarded to the small proxy container that holds the Google API key ---
        location /ai/ {
            resolver 127.0.0.11 valid=10s;      # docker's DNS, so nginx still starts if the proxy is down
            set $ai_up http://ai-proxy:8090;
            proxy_pass $ai_up;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            client_max_body_size 30m;
            proxy_buffering off;
        }

        # --- office NAS storage (the tool uses these automatically) ---
        location = /nas/ping {
            default_type text/plain;
            add_header Cache-Control "no-store";
            return 200 "ok";
        }

        # finished videos: the tool uploads here
        location /nas/videos/ {
            alias /data/videos/;
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:rw all:rw;
            autoindex on;
            autoindex_format json;
            add_header Cache-Control "no-store";
        }

        # shared music library: drop songs into Office/ShirtReels/music, or use "Add to NAS library"
        location /nas/music/ {
            alias /data/music/;
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:rw all:rw;
            autoindex on;
            autoindex_format json;
            add_header Cache-Control "no-store";
        }

        # presets shared by the whole team
        location /nas/presets/ {
            alias /data/presets/;
            dav_methods PUT;
            create_full_put_path on;
            dav_access user:rw group:rw all:rw;
            add_header Cache-Control "no-store";
        }
    }
}
